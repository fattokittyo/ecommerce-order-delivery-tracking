<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olist Local DBMS Demo</title><style>body{font:15px system-ui;background:#f1f5f9;color:#183148;margin:0}header{background:#183148;color:#fff;padding:20px}main{max-width:1050px;margin:auto;padding:20px}nav button{margin:4px;background:#087d75;color:#fff;border:0;border-radius:6px;padding:9px 13px;cursor:pointer}.box{background:white;padding:18px;border-radius:10px;margin:16px 0;box-shadow:0 1px 6px #0001}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd;word-break:break-word}section{overflow-x:auto}input,textarea{padding:9px;max-width:100%}textarea{width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{margin:0}small{opacity:.8}.stat{display:inline-block;background:#e3f1f0;padding:12px;margin:6px;border-radius:8px}</style></head><body><header><h1>Olist Order & Delivery Tracking</h1><small>Educational local SQLite database demonstration • Historical sample, not a real-time Olist system</small></header><main><nav id="nav"></nav><div class="box"><h2 id="name">Dashboard</h2><p id="info"></p><div id="content"></div></div><small>Database: local SQLite. Real anonymized Olist order records; follow-ups are new demonstration records.</small></main><script>
const pages=['Dashboard','Orders','Customers','Late Deliveries','Follow-ups','SQL Console','Schema'];const nav=document.getElementById('nav');pages.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);nav.append(b)});
const get=async p=>{const r=await fetch('/api/'+p);return r.json()},post=async(p,obj)=>{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});return r.json()};
function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function table(rows){if(!Array.isArray(rows))return '<pre>'+escape(JSON.stringify(rows))+'</pre>';if(!rows.length)return '<p>No records found.</p>';let keys=Object.keys(rows[0]);return '<section><table><thead><tr>'+keys.map(k=>'<th>'+escape(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(o=>'<tr>'+keys.map(k=>'<td>'+escape(o[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></section>'}
let active=0;async function show(n){active=n;document.getElementById('name').textContent=pages[n];const content=document.getElementById('content'),info=document.getElementById('info');content.innerHTML='Loading...';info.textContent='';
try{
if(n===0){let x=await get('summary');content.innerHTML='<div class="stat">Total: '+x.total+'</div><div class="stat">On time: '+x.on_time+'</div><div class="stat">Late: '+x.late+'</div><div class="stat">Not delivered: '+x.pending+'</div>'+table(await get('late'));info.textContent='Delivery performance based only on the 30-order sample';}
if(n===1){info.textContent='Search historical order or customer IDs';content.innerHTML='<input id="find" placeholder="Search order ID or customer ID"><div id="results"></div>';const input=document.getElementById('find');const run=async()=>document.getElementById('results').innerHTML=table(await get('orders?q='+encodeURIComponent(input.value)));input.oninput=run;run();}
if(n===2)content.innerHTML=table(await get('customers'));
if(n===3)content.innerHTML=table(await get('late'));
if(n===4){content.innerHTML='<p>Add a local issue record. This does not alter historical source data.</p><input id="oid" placeholder="Order ID" style="width:330px"><textarea id="note" placeholder="Follow-up note"></textarea><button id="save">Save Follow-up</button><p id="msg"></p><div id="records"></div>';document.getElementById('save').onclick=async()=>{let x=await post('followups',{order_id:document.getElementById('oid').value,note:document.getElementById('note').value});document.getElementById('msg').textContent=x.error||'Follow-up saved';if(!x.error)show(4)};document.getElementById('records').innerHTML=table(await get('followups'))}
if(n===5){content.innerHTML='<p>Enter one read-only SQLite SELECT query (limit 100 rows).</p><textarea id="sql" rows="4">SELECT order_status, COUNT(*) AS total FROM orders GROUP BY order_status</textarea><button id="run">Run SQL</button><div id="out"></div>';document.getElementById('run').onclick=async()=>document.getElementById('out').innerHTML=table(await post('sql',{query:document.getElementById('sql').value}));}
if(n===6){let x=await get('schema');content.innerHTML=x.map(y=>'<div class="box"><b>'+escape(y.name)+'</b><pre>'+escape(y.sql)+'</pre></div>').join('');}
}catch(e){content.textContent='Error: '+e.message}}
show(0);</script></body></html>
