name: Generate narrated DBMS demonstration video
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/render_demo_video.py'
      - '.github/workflows/generate-demo-video.yml'

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source files
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video and speech requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core
          python -m pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
      - name: Generate demonstration from working app
        run: python scripts/render_demo_video.py
      - name: Keep downloadable video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-dbms-demonstration
          path: Olist_DBMS_Demonstration_Video_GitHub.mp4
      - name: Commit video to latest branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            git add -f Olist_DBMS_Demonstration_Video_GitHub.mp4
            if git diff --staged --quiet; then
              echo "Video already committed"
              exit 0
            fi
            git commit -m "Add narrated DBMS demonstration video"
            if git push origin HEAD:main; then exit 0; fi
            echo "Repository changed; retrying..."
          done
          exit 1
